<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
    <title>Movies</title>
</head>
<body>
<div id='app'>
    <h1 id='movie-header'>Best movies</h1>
    <ul id='movie-list'></ul>
</div>
<div>
    <label for="movie-name">Movie name</label>
<input id="movie-name" type="text" placeholder="Movie name">
    <input id="movie-year" type="number" placeholder="Movie year">
<button id="movie-add">Add</button>
</div>
<div>
<label for="movie-search">Movie search</label>
    <input id="movie-search" type="text">
    <button id="movie-find">Find</button>
</div>
<div><button id="delete-movies">Delete</button></div>
<div><button id="theme-button"> Toggle theme </button></div>
</body>
</html>
